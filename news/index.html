<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="综合新闻、人工智能和科技动态，按发布时间更新，附来源与原文链接。"
    />
    <meta property="og:title" content="ZrBac 资讯 · 综合与科技" />
    <meta property="og:description" content="综合新闻、AI 与科技资讯。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zrbac.github.io/" />
    <link rel="canonical" href="https://zrbac.github.io/" />
    <link rel="icon" type="image/svg+xml" href="/assets/news/favicon.svg" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="ZrBac 资讯 RSS"
      href="/news.xml"
    />
    <link rel="stylesheet" href="/assets/news/style.css" />
    <title>ZrBac 资讯 · 综合热点与 AI 科技资讯</title>
    <script src="/assets/news/app.js" defer></script>
  </head>
  <body>
    <a href="#news-content" class="skip-link">跳到资讯列表</a>
    <header class="header">
      <div class="header-inner">
        <a class="brand" href="#all" aria-label="ZrBac 资讯首页"
          ><span class="brand-name"
            >ZrBac<span class="brand-separator">/</span>资讯</span
          ></a
        >
        <nav class="top-nav" aria-label="主导航">
          <a href="#all" data-view="all" class="active">最新</a>
          <a href="#general" data-view="general">综合</a>
          <a href="#tech" data-view="tech">科技</a>
          <a href="#brief" data-view="brief">每日速览</a>
        </nav>
        <div class="header-actions">
          <button
            id="search-trigger"
            class="icon-button"
            aria-label="搜索资讯"
            title="搜索 / Ctrl K"
          >
            <span data-icon="search"></span>
          </button>
          <button
            id="theme-toggle"
            class="icon-button"
            aria-label="切换深色模式"
            title="切换主题"
          >
            <span data-icon="moon"></span>
          </button>
          <a href="#saved" class="saved-link" data-view="saved"
            ><span data-icon="bookmark"></span><span>我的收藏</span
            ><b id="saved-count" hidden>0</b></a
          >
        </div>
      </div>
    </header>

    <main class="page">
      <div class="update-bar">
        <span id="edition-date">资讯更新</span>
        <span id="update-status" role="status">正在加载…</span>
        <button id="sources-trigger">来源状态</button>
      </div>

      <div class="main-layout">
        <section
          id="news-content"
          class="news-section"
          aria-labelledby="section-title"
          tabindex="-1"
        >
          <div class="section-heading">
            <div>
              <h1 id="section-title">最新资讯</h1>
            </div>
            <span id="result-count" class="result-count"></span>
          </div>
          <div class="filter-tabs" role="group" aria-label="资讯分类">
            <button data-filter="all" class="selected" aria-pressed="true">
              全部资讯
            </button>
            <button data-filter="general" aria-pressed="false">综合热点</button>
            <button data-filter="tech" aria-pressed="false">科技动态</button>
            <button data-filter="ai" aria-pressed="false">人工智能</button>
          </div>
          <div class="filter-row">
            <label class="search-box"
              ><span data-icon="search"></span
              ><input
                id="search"
                type="search"
                placeholder="搜索标题、关键词…"
                aria-label="搜索资讯标题和摘要"
              /><kbd>/</kbd></label
            >
            <label class="source-select"
              ><span class="sr-only">按资讯源筛选</span
              ><select id="source-filter">
                <option value="all">全部来源</option>
              </select></label
            >
            <button
              id="date-trigger"
              class="date-button"
              aria-expanded="false"
              aria-controls="date-panel"
            >
              <span data-icon="calendar"></span><span>日期</span>
            </button>
          </div>
          <div id="date-panel" class="date-panel" hidden>
            <label for="date-filter">按发布日期查看（北京时间）</label
            ><input type="date" id="date-filter" /><button
              id="clear-date"
              class="text-button"
            >
              查看全部日期
            </button>
          </div>
          <p id="view-note" class="view-note" hidden></p>
          <div
            id="articles"
            class="article-list"
            aria-live="polite"
            aria-busy="true"
          >
            <div class="loading-state">
              <span class="loading-ring"></span>
              <p>正在加载资讯…</p>
            </div>
          </div>
          <button id="load-more" class="load-more" hidden>
            加载更多 <span data-icon="arrow-down"></span>
          </button>
          <p id="list-end" class="list-end" hidden>已显示全部结果。</p>
        </section>

        <aside class="sidebar">
          <section class="radar-card">
            <div class="sidebar-heading">
              <h2>各站最新</h2>
              <span>每站一条</span>
            </div>
            <ol id="latest-list">
              <li class="sidebar-placeholder">正在获取最新资讯…</li>
            </ol>
          </section>
          <section class="sidebar-section">
            <div class="sidebar-heading">
              <h2>AI 动态</h2>
              <a href="#ai">更多</a>
            </div>
            <ol id="tech-list" class="side-list"></ol>
          </section>
          <section class="source-card">
            <div class="sidebar-heading"><h2>订阅来源</h2></div>
            <div id="source-badges" class="source-badges"></div>
            <button id="about-trigger" class="text-button">关于本站</button>
          </section>
        </aside>
      </div>
    </main>
    <footer class="footer">
      <span class="copyright">© <span id="year">2026</span> ZrBac</span>
      <div class="footer-links">
        <a href="/blog/">博客归档</a><a href="/news.xml">RSS</a>
        <button id="footer-sources">资讯来源</button>
        <a
          href="https://github.com/ZrBac/ZrBac.github.io"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub</a
        >
      </div>
    </footer>
    <dialog id="info-dialog" aria-labelledby="dialog-title">
      <div class="dialog-heading">
        <h2 id="dialog-title">资讯来源</h2>
        <button id="close-dialog" class="icon-button" aria-label="关闭窗口">
          <span data-icon="x"></span>
        </button>
      </div>
      <div id="dialog-content"></div>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <noscript
      ><div class="noscript">
        资讯列表需要 JavaScript。你也可以阅读
        <a href="/news.xml">RSS 资讯订阅</a> 或访问
        <a href="/blog/">原博客归档</a>。
      </div></noscript
    >
  </body>
</html>
