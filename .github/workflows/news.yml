name: Update and publish news

on:
  push:
    branches: [hexo]
    paths: ["news/**", "scripts/**", "tests/**", ".github/workflows/news.yml"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: news-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Check out the original published blog
        uses: actions/checkout@v6
        with:
          ref: master
          path: _legacy
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test feed parsing and archive preservation
        run: python -m unittest discover -s tests -v
      - name: Validate browser script
        run: node --check news/assets/app.js
      - name: Collect news and retain the previous archive
        run: python scripts/collect_news.py --previous-url https://zrbac.github.io/data/news.json
      - name: Build portal and preserve blog URLs
        run: python scripts/build_news.py --legacy _legacy
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
